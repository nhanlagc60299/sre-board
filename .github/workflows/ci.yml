name: Verify SRE Board
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enforce 500 changed text lines per PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          rows = subprocess.check_output(['git','diff','--numstat',os.environ['BASE'],os.environ['HEAD']], text=True)
          total = 0
          for row in rows.splitlines():
              added, deleted, path = row.split('\t', 2)
              if added == '-':
                  print('Binary evidence requires visual review:', path)
              else:
                  total += int(added) + int(deleted)
          print('Changed text lines:', total)
          assert total <= 500, 'Split this PR; do not bypass the policy'
          PY
      - name: Python syntax
        run: python -m compileall -q sreboard tests
      - name: Domain and real HTTP/SQLite integration
        run: python -m unittest discover -v
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Session and focus regression tests (mocked DOM/fetch)
        run: node --test tests/ui.test.cjs
